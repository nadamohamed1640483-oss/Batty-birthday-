<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بطتي ❤</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe5ec, #f0f4f8);
    text-align: center;
    min-height: 100vh;
    padding-bottom: 40px;
}

.container{
    width: 92%;
    max-width: 500px;
    margin: auto;
    margin-top: 30px;
    background: white;
    padding: 25px 20px;
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(163, 118, 140, 0.15);
    box-sizing: border-box;
}

h1 {
    color: #a24857;
    font-size: 22px;
    margin-bottom: 20px;
}

/* زرار البداية الكبير */
.start-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 50px;
    background: #b36b85;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(179, 107, 133, 0.3);
    transition: 0.2s;
}

/* عنوان السؤال الفرعي */
.question-number {
    font-size: 13px;
    color: #a0a0a0;
    margin-bottom: 5px;
    font-weight: bold;
}

.question-text {
    font-size: 18px;
    color: #4a4a4a;
    font-weight: bold;
    margin-bottom: 20px;
    line-height: 1.5;
}

/* ستايل الخيارات الطويلة المستديرة زي الصورة */
.option-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 20px;
    margin: 12px 0;
    background: #fcfcfc;
    border: 1.5px solid #e8e8e8;
    border-radius: 50px; /* مستدير بالكامل */
    box-sizing: border-box;
    cursor: pointer;
    transition: all 0.25s ease;
}

.option-text {
    font-size: 16px;
    color: #555;
    font-weight: 500;
}

/* شكل الدائرة (الراديو) اللي على الشمال */
.radio-circle {
    width: 18px;
    height: 18px;
    border: 2px solid #ccc;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.radio-inner {
    width: 10px;
    height: 10px;
    background: transparent;
    border-radius: 50%;
    transition: all 0.2s ease;
}

/* حالة الاختيار الصحيح */
.option-container.correct-style {
    background: #fff0f5;
    border-color: #b36b85;
}
.option-container.correct-style .radio-circle {
    border-color: #b36b85;
}
.option-container.correct-style .radio-inner {
    background: #b36b85;
}

/* حالة الاختيار الخطأ */
.option-container.wrong-style {
    background: #fdf2f2;
    border-color: #f08080;
}
.option-container.wrong-style .radio-circle {
    border-color: #f08080;
}

/* ستايل نافذة الإنذار الكيوت */
.custom-alert {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.alert-box {
    background: white;
    padding: 25px;
    border-radius: 24px;
    max-width: 380px;
    width: 85%;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.alert-text {
    color: #a24857;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    line-height: 1.5;
}

.alert-btn {
    background: #b36b85;
    color: white;
    padding: 10px 30px;
    border: none;
    border-radius: 50px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* ستايل الفاصل بين الأسئلة */
.section-divider {
    height: 1px;
    background: #eee;
    margin: 30px 10px;
}

img {
    width: 100%;
    border-radius: 20px;
    margin-top: 20px;
}

video {
    margin-top: 20px;
    border-radius: 20px;
}

/* ستايل عداد الأيام السحري */
.counter-box {
    background: #fff5f7;
    border: 2px dashed #b36b85;
    border-radius: 18px;
    padding: 15px;
    margin: 25px 0;
}
.counter-title {
    color: #a24857;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
    line-height: 1.5;
}
#timer {
    font-size: 17px;
    color: #b36b85;
    font-weight: bold;
    line-height: 1.6;
    margin-top: 5px;
}

/* الأكواد الجديدة الخاصة بصندوق التشفير والرسالة */
.encryption-box {
    background: #fffafb;
    border: 2px dashed #b36b85;
    border-radius: 20px;
    padding: 20px 15px;
    margin-top: 20px;
}
input[type="text"] {
    width: 85%;
    padding: 12px 20px;
    border: 2px solid #e8e8e8;
    border-radius: 50px;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: 0.3s;
    margin-top: 10px;
    margin-bottom: 10px;
}
input[type="text"]:focus {
    border-color: #b36b85;
}
.letter-box {
    text-align: right;
    font-size: 17px;
    color: #4a4a4a;
    line-height: 1.8;
    white-space: pre-line;
}
.cursor {
    display: inline-block;
    width: 2px;
    background-color: #b36b85;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

</style>
</head>

<body>

<div class="custom-alert" id="customAlert">
    <div class="alert-box">
        <div class="alert-text" id="alertMessage">الرسالة هنا</div>
        <button class="alert-btn" id="alertCloseBtn" onclick="closeAlert()">خلاص هختار صح 🙂</button>
    </div>
</div>

    <button class="start-btn" onclick="startQuestions()">يلا نبدأ يابطه 🌚</button>
</div>

    <button class="start-btn" style="margin-top: 30px; background: #a24857;" onclick="checkAllAnswers()">يلا الي بعده 🌚</button>
